# 数据根目录
local:
  # output_dir: "/Users/yaodongdong/Desktop/naver/outputs"
  # Windows示例: "D:/stock_data_pipeline/outputs"
  output_dir: "../outputs"
  # 本地Parquet临时仓库，Windows可写成 "D:/stock_data_pipeline/warehouse"
  warehouse_dir: "../warehouse"
  # 历史ID索引缓存
  index_cache_dir: "../index_cache"
  # temp_dir: "../tmp"
server:
  host: "192.168.1.33"
  user: "dwyao"
  data_dir: "/mnt/nas-intern/homes/dwyao/Data/stocklake"
postgres:
  host: "192.168.1.33"
  port: 5432
  database: "stock_data"
  user: "stock"
  password: "Stock2026Secure!"
storage:
  local_warehouse:
      "../warehouse"
  server_warehouse:
      "/mnt/nas-intern/homes/dwyao/Data/stocklake"
  partition:
    # parquet单文件最大
    max_rows: 50000
  compression:
    # codec: "snappy"
    codec: "zstd"
sync:
  delete_after_upload: true
  # auto: macOS/Linux优先rsync，Windows自动使用scp
  # 可手动指定: rsync 或 scp
  method: auto
  rsync:
    enabled: true
    ssh_port: 22
watch:
  # 每隔多少秒扫描一次 output_dir
  interval_seconds: 20
  # 文件最后修改超过多少秒后才认为写入完成
  quiet_seconds: 30
  # 达到任一阈值就处理一批
  min_files: 100
  min_bytes: 10485760
  # 单轮最多处理多少个 JSON，避免一次吃太多
  max_files_per_batch: 5000
  # Ctrl-C 退出前是否处理最后一批稳定文件
  run_on_exit: true
research:
  project_dir: "../naver_research"
  warehouse_dir: "../warehouse"
  pdf_dir: "../naver_research/research_spool/pdf"
  remote_pdf_dir: "/mnt/nas-intern/homes/dwyao/Data/stocklake/research_pdf"
  sync_pdf: true
  delete_after_upload: true
  watch:
    interval_seconds: 30
    quiet_seconds: 60
    min_files: 20
    min_bytes: 104857600
    max_files_per_batch: 2000
